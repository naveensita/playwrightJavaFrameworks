name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to run tests against'
        required: true
        type: choice
        default: 'qa'
        options:
          - dev
          - qa
          - staging
          - prod
      browser:
        description: 'Select browser to run tests'
        required: true
        type: choice
        default: 'chromium'
        options:
          - chromium
          - firefox
          - safari
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build & Install
        run: mvn -B install -D skipTests --no-transfer-progress
      - name: Ensure browsers are installed
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"
      - name: Run tests
        run: mvn test -PFramework -Dbrowser={{github.event.inputs.browser}} -Denv={{github.event.inputs.environment}}